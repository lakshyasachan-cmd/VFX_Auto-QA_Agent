# =============================================================================
#  VFX Mission Control — Full Stack Docker Compose
#  Services: postgres | redis | backend | dashboard | nginx
#
#  Usage:
#    docker compose up --build -d          # Build and start all services
#    docker compose ps                      # Check health status
#    docker compose logs -f backend         # Stream backend logs
#    docker compose down                    # Stop (data preserved)
#    docker compose down -v                 # Stop + delete all volumes
# =============================================================================

services:

  # ─── PostgreSQL 16: Persistent Relational Store ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vfx_postgres
    env_file:
      - .env
    environment:
      # These override .env keys if set; using .env values via variable expansion
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"       # Host 5433 → container 5432 (avoids clash with local PG)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - vfx_network

  # ─── Redis 7: Event Bus with AOF Durability ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vfx_redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"       # Host 6380 → container 6379 (avoids clash with local Redis)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - vfx_network

  # ─── FastAPI Backend: Multi-Agent Investigation Engine ────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vfx_backend
    env_file:
      - .env
    environment:
      # Override DATABASE_URL and REDIS_URL to point to Docker service hostnames
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      WATSONX_MOCK: "true"       # Demo mode — no IBM credentials required
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - vfx_network

  # ─── Next.js Dashboard: Mission Control Operator UI ───────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1   # Routed via Nginx on host
    container_name: vfx_dashboard
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - vfx_network

  # ─── Nginx: Reverse Proxy & SSE Gateway ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vfx_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vfx_network

# ─── Named Volumes (data persists across docker compose down) ─────────────────
volumes:
  postgres_data:
    name: vfx_postgres_data
  redis_data:
    name: vfx_redis_data

# ─── Dedicated bridge network for inter-service communication ─────────────────
networks:
  vfx_network:
    name: vfx_network
    driver: bridge
