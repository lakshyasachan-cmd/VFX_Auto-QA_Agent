version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vfx_mission_control_backend
    ports:
      - 8001:8001
    environment:
      - WATSONX_MOCK=true
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./vfx_mission_control.db
      - VFX_ADMIN_API_KEY=vfx-admin-secret-key-prod-001
      - VFX_LEAD_TD_API_KEY=vfx-lead-td-secret-key-prod-002
      - VFX_TD_API_KEY=vfx-td-standard-key-prod-003
      - VFX_SYSTEM_API_KEY=vfx-system-internal-key-prod-004
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: vfx_mission_control_redis
    ports:
      - 6379:6379
