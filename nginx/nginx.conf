worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ── Gzip compression for dashboard static assets ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend_api {
        server backend:8001;
        keepalive 32;
    }

    upstream dashboard_ui {
        server dashboard:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ── SSE: Real-time incident stream (must be before generic /api/) ─────
        # Disables buffering so Server-Sent Events flow through immediately.
        location /api/v1/incidents/stream/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';        # Required for SSE keep-alive
            proxy_buffering off;                   # Disable nginx response buffering
            proxy_cache off;
            proxy_read_timeout 3600s;              # Allow 1-hour SSE connections
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;       # Signal upstream to not buffer
            add_header Cache-Control no-cache;
        }

        # ── FastAPI backend: /api/ and /docs, /redoc, /openapi.json ──────────
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location /docs {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Next.js Dashboard: all other routes ───────────────────────────────
        location / {
            proxy_pass http://dashboard_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # ── Next.js static assets: long cache ─────────────────────────────────
        location /_next/static/ {
            proxy_pass http://dashboard_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
